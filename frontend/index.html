<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EnterpriseAgent Mini</title><style>body{font:16px system-ui,sans-serif;max-width:760px;margin:40px auto;padding:0 18px;color:#182535;background:#f5f7fa}main{background:white;padding:24px;border-radius:12px}textarea,input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #adb8c5;border-radius:6px;font:inherit}button{padding:10px 18px;margin:8px 8px 0 0;background:#24466e;color:white;border:0;border-radius:6px;cursor:pointer}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f0f3f7;padding:14px;border-radius:6px}small{color:#536477}</style><main><h1>EnterpriseAgent Mini</h1><p>企业订单助手 · 本地教学演示 · 全部业务数据均为模拟数据</p><label>会话 ID<input id="session" value="demo"></label><p><label>用户问题<textarea id="q" rows="3">如果订单12345没发货，告诉我能否退款。</textarea></label></p><button id="send">发送</button><button id="stop" disabled>停止</button><h2>回答</h2><pre id="answer">等待请求</pre><h2>执行轨迹</h2><pre id="trace"></pre><small>本页使用 POST fetch + SSE。最终业务回答来自工具结果；不是模拟打字动画。</small></main><script>
const $=id=>document.getElementById(id);let controller;
$('send').onclick=async()=>{controller=new AbortController();$('send').disabled=true;$('stop').disabled=false;$('answer').textContent='';$('trace').textContent='';let done=false;try{const r=await fetch('/chat/stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:$('session').value,question:$('q').value}),signal:controller.signal});if(!r.ok||!r.body)throw Error('HTTP '+r.status);const reader=r.body.getReader(),decoder=new TextDecoder();let buf='';while(true){const {value,done:end}=await reader.read();buf+=decoder.decode(value||new Uint8Array(),{stream:!end});let pos;while((pos=buf.indexOf('\n\n'))>=0){const block=buf.slice(0,pos);buf=buf.slice(pos+2);const kind=block.split('\n').find(x=>x.startsWith('event: '))?.slice(7);const raw=block.split('\n').find(x=>x.startsWith('data: '))?.slice(6);if(!kind||!raw)continue;const data=JSON.parse(raw);$('trace').textContent+=kind+' '+JSON.stringify(data)+'\n';if(kind==='answer')$('answer').textContent=data.text;if(kind==='done'){done=true;if(data.status!=='completed')$('answer').textContent+= '\n状态：'+data.status;}}if(end)break;}if(!done)throw Error('事件流未正常完成');}catch(e){$('answer').textContent+='\n'+(e.name==='AbortError'?'已停止等待；已完成操作不会自动撤销。':'请求失败：'+e.message);}finally{$('send').disabled=false;$('stop').disabled=true;controller=null;}};$('stop').onclick=()=>controller?.abort();</script></html>
